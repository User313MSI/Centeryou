<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: file:; img-src 'self' blob: file: data:;">
  <title>HarborCut</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="menubar">
    <div class="brand">⚓ HarborCut</div>
    <button id="btn-import" class="mb-btn">Import Media</button>
    <button id="btn-save" class="mb-btn">Save Project</button>
    <button id="btn-open" class="mb-btn">Open Project</button>
    <div class="spacer"></div>
    <button id="btn-undo" class="mb-btn" title="Ctrl+Z">↩ Undo</button>
    <button id="btn-redo" class="mb-btn" title="Ctrl+Shift+Z">↪ Redo</button>
    <button id="btn-export" class="mb-btn primary">Export Video</button>
  </header>

  <main id="layout">
    <aside id="pool-panel">
      <div class="panel-title">Media Pool</div>
      <div id="pool" class="pool"></div>
      <div class="panel-hint">Drop video/audio/image files anywhere</div>
    </aside>

    <section id="preview-panel">
      <div class="panel-title">Viewer</div>
      <div id="preview-container">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div id="transport">
        <button id="btn-skip-back" class="tr-btn" title="Home">⏮</button>
        <button id="btn-prev-frame" class="tr-btn" title="Frame back">◀|</button>
        <button id="btn-play" class="tr-btn big" title="Space">▶</button>
        <button id="btn-next-frame" class="tr-btn" title="Frame forward">|▶</button>
        <button id="btn-skip-end" class="tr-btn" title="End">⏭</button>
        <span id="timecode">00:00:00.000</span>
        <span id="zoom-label"></span>
        <input type="range" id="zoom" min="10" max="400" value="60" title="Timeline zoom">
      </div>
    </section>
  </main>

  <section id="inspector-panel">
    <div class="panel-title">Inspector</div>
    <div id="inspector" class="inspector-empty">Select a clip to edit its properties</div>
  </section>

  <footer id="timeline-panel">
    <div id="timeline-toolbar">
      <button id="btn-split" class="tl-btn" title="S — split clip at playhead">✂ Split</button>
      <button id="btn-delete" class="tl-btn" title="Del">🗑 Delete</button>
      <button id="btn-fade-in" class="tl-btn">Fade In</button>
      <button id="btn-fade-out" class="tl-btn">Fade Out</button>
      <button id="btn-add-text" class="tl-btn" title="T — add text at playhead">🅣 Text</button>
      <button id="btn-add-video-track" class="tl-btn">+ Video Track</button>
      <button id="btn-add-audio-track" class="tl-btn">+ Audio Track</button>
      <div class="spacer"></div>
      <div class="tl-snapping"><label><input type="checkbox" id="snapping" checked> Snapping</label></div>
    </div>
    <div id="ruler"></div>
    <div id="tracks"></div>
  </footer>

  <div id="drop-overlay" hidden>Release to import</div>
  <div id="toast" hidden></div>

  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
