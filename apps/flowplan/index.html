<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#101418">
  <title>FlowPlan — Ton planning en un mot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="fp-top">
    <div class="fp-brand">🌊 FlowPlan</div>
    <div class="fp-top-actions">
      <input id="fp-search" class="fp-search" type="search" placeholder="Rechercher…" aria-label="Rechercher un événement">
      <button id="fp-add" class="fp-btn primary">+ Ajouter</button>
      <div class="fp-menu">
        <button id="fp-menu-btn" class="fp-btn" aria-label="Menu" aria-haspopup="true">⋯</button>
        <div id="fp-menu-panel" class="fp-menu-panel" hidden>
          <button id="fp-undo" class="fp-menu-item">↩️ Annuler (Ctrl+Z)</button>
          <button id="fp-theme" class="fp-menu-item">☀️ Thème clair</button>
          <button id="fp-export" class="fp-menu-item">📅 Exporter (.ics)</button>
          <button id="fp-import" class="fp-menu-item">📥 Importer (.ics)</button>
          <button id="fp-reminders" class="fp-menu-item">🔕 Rappels : désactivés</button>
          <button id="fp-vault" class="fp-menu-item">🔐 Verrouiller (code PIN)</button>
          <button id="fp-print" class="fp-menu-item">🖨️ Imprimer</button>
          <hr>
          <button id="fp-reset" class="fp-menu-item danger">🗑️ Réinitialiser mes données</button>
        </div>
      </div>
    </div>
  </header>

  <section class="fp-hero">
    <h1>Dis ta semaine. On fait le planning.</h1>
    <div class="fp-input-row">
      <textarea id="fp-input" rows="1" placeholder="Écris ou dicte ton planning… (Ctrl+Entrée)"></textarea>
      <button id="fp-voice" class="fp-btn" title="Saisie vocale">🎙️</button>
      <button id="fp-generate" class="fp-btn primary">✨ Générer</button>
    </div>
    <button id="fp-examples-toggle" class="fp-link">voir des exemples ▾</button>
    <div id="fp-examples" class="fp-examples" hidden>
      <button class="fp-example" data-example="Lundi 9h réunion équipe ; mercredi 14h30 dentiste ; vendredi 18h apéro">Semaine type</button>
      <button class="fp-example" data-example="Tous les lundis 18h30 sport ; tous les jours 7h réveil ; 12 mai 2026 10h dentiste">Récurrence + date</button>
      <button class="fp-example" data-example="Samedi mariage de Julie ; 25/12/2026 Noël en famille">Dates précises</button>
    </div>
    <div id="fp-status" class="fp-status"></div>
  </section>

  <section class="fp-weekbar">
    <button id="fp-prev-week" class="fp-btn ghost" aria-label="Précédent">←</button>
    <span id="fp-week-label" class="fp-week-label"></span>
    <button id="fp-today-week" class="fp-btn ghost">Aujourd'hui</button>
    <button id="fp-next-week" class="fp-btn ghost" aria-label="Suivant">→</button>
    <span class="fp-view-switch">
      <button id="fp-view-day" class="fp-btn ghost">Jour</button>
      <button id="fp-view-week" class="fp-btn ghost active">Semaine</button>
      <button id="fp-view-month" class="fp-btn ghost">Mois</button>
    </span>
  </section>

  <div id="fp-stats" class="fp-stats"></div>
  <div id="fp-conflicts" class="fp-conflicts" hidden></div>
  <div id="fp-filters" class="fp-filters"></div>

  <main id="fp-week" class="fp-week"></main>
  <main id="fp-month" class="fp-month" style="display:none"></main>
  <main id="fp-day" class="fp-day-view" style="display:none"></main>

  <div id="fp-modal" class="fp-modal-backdrop" hidden>
    <div class="fp-modal">
      <div class="fp-modal-head">
        <h2>Événement</h2>
        <button id="fp-modal-close" class="fp-modal-x" title="Fermer (Échap)" aria-label="Fermer">✕</button>
      </div>
      <label>Titre <input id="fp-modal-title" type="text" maxlength="120"></label>
      <label>Date <input id="fp-modal-date" type="date"></label>
      <div class="fp-modal-times">
        <label>Début <input id="fp-modal-start" type="time"></label>
        <label>Fin <input id="fp-modal-end" type="time"></label>
        <label class="fp-allday"><input id="fp-modal-allday" type="checkbox"> Journée entière</label>
      </div>
      <label>Catégorie
        <select id="fp-modal-cat">
          <option value="autre">autre</option>
          <option value="travail">travail</option>
          <option value="sport">sport</option>
          <option value="sante">santé</option>
          <option value="perso">perso</option>
          <option value="courses">courses</option>
          <option value="etudes">études</option>
        </select>
      </label>
      <label>Notes <textarea id="fp-modal-notes" rows="2" maxlength="2000" placeholder="Détails éventuels…"></textarea></label>
      <div class="fp-modal-actions">
        <button id="fp-modal-delete" class="fp-btn danger">Supprimer</button>
        <span class="fp-spacer"></span>
        <button id="fp-modal-cancel" class="fp-btn">Annuler</button>
        <button id="fp-modal-save" class="fp-btn primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="fp-toasts" class="fp-toasts" aria-live="polite"></div>

  <!-- Écran de verrouillage (vault) -->
  <div id="fp-lock" class="fp-modal-backdrop" hidden>
    <div class="fp-modal fp-lock-modal">
      <h2>🔒 FlowPlan est verrouillé</h2>
      <p class="fp-muted">Entre ton code pour déchiffrer tes données (elles restent chiffrées sur cet appareil).</p>
      <input id="fp-lock-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code à 4+ chiffres" maxlength="64">
      <div id="fp-lock-error" class="fp-status error"></div>
      <div class="fp-modal-actions">
        <button id="fp-lock-submit" class="fp-btn primary">Déverrouiller</button>
      </div>
    </div>
  </div>

  <footer class="fp-footer">FlowPlan v3.1 — 100 % local, tes données restent sur cet appareil.</footer>

  <script src="js/parser.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/store.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/ics-import.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/secure-store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
