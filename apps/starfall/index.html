<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starfall Academy — Animated Series</title>
<style>
  body { margin: 0; background: #06091a; color: #e8ecf8; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { margin: 18px 0 4px; letter-spacing: 1px; }
  h1 .accent { color: #ffd98a; }
  .sub { color: #8b98b5; font-size: 13px; margin-bottom: 12px; }
  #stage-wrap { position: relative; width: min(96vw, 1280px); }
  canvas { width: 100%; display: block; border-radius: 12px; background: #000; box-shadow: 0 8px 40px rgba(60, 80, 200, 0.25); }
  #controls { display: flex; gap: 10px; align-items: center; margin: 14px 0 30px; flex-wrap: wrap; justify-content: center; }
  button { background: #1c2350; color: #e8ecf8; border: 1px solid #33407a; border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  button:hover { background: #263070; }
  button.play { background: #ffd98a; color: #20180a; font-weight: 800; border-color: #ffd98a; }
  #time { font-family: monospace; color: #8b98b5; }
  .eps { display: flex; gap: 10px; }
  .eps button.active { border-color: #ffd98a; color: #ffd98a; }
  footer { color: #55617e; font-size: 12px; margin-bottom: 20px; }
</style>
</head>
<body>
  <h1>✨ Starfall <span class="accent">Academy</span></h1>
  <div class="sub">An original animated series — Season 1</div>
  <div id="stage-wrap"><canvas id="screen" width="1280" height="720"></canvas></div>
  <div id="controls">
    <div class="eps">
      <button id="ep1-btn" class="active">Ep 1 · The Falling Hour</button>
      <button id="ep2-btn">Ep 2 · The Sky Remembers</button>
    </div>
    <button id="play-btn" class="play">▶ Play</button>
    <button id="restart-btn">⟲ Restart</button>
    <span id="time">00:00 / 00:00</span>
  </div>
  <footer>Starfall Academy · © 2025 NovaLoom · Original score generated in-browser via WebAudio</footer>

<script src="audio.js"></script>
<script src="characters.js"></script>
<script src="stage.js"></script>
<script src="episodes.js"></script>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const W = Stage.W, H = Stage.H;

  let episode = Episodes.ep1();
  let time = 0;
  let playing = false;
  let raf = null;
  let last = 0;
  let currentScene = 'city';
  let currentMood = null;

  const sceneFns = {
    city: (t) => Stage.cityBackdrop(ctx, t),
    academy: (t) => Stage.academyRoom(ctx, t),
    night: (t) => Stage.nightSky(ctx, t),
    bridge: (t) => Stage.starbridge(ctx, t),
  };

  function activeBeats(t) {
    return episode.beats.filter((b) => t >= b.start && t < b.start + b.dur);
  }

  function drawAnim(name, t, localT) {
    if (name === 'lumi_dive') {
      const p = localT;
      Characters.drawLumi(ctx, 300 + p * 500, 200 + p * 260 + Math.sin(p * 8) * 10, t, { scale: 0.9 });
      ctx.fillStyle = 'rgba(255,240,180,0.7)';
      Characters.drawStarShape(ctx, 850, 430, 10 + Math.sin(t * 6) * 3);
      ctx.fill();
    } else if (name === 'constellation_fall') {
      const p = Math.min(1, localT / 8);
      ctx.strokeStyle = 'rgba(200,220,255,0.8)';
      ctx.lineWidth = 2;
      const hx = 500 + p * 200, hy = 80 + p * 350;
      const pts = [[0,0],[60,30],[130,10],[200,60],[90,80],[150,140],[60,150]];
      ctx.beginPath();
      pts.forEach(([x,y], i) => {
        const px = hx + x * 0.8, py = hy + y * 0.8;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      });
      ctx.stroke();
      for (const [x, y] of pts) {
        ctx.fillStyle = '#cfe0ff';
        ctx.beginPath(); ctx.arc(hx + x * 0.8, hy + y * 0.8, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    } else if (name === 'heron') {
      const wing = Math.sin(t * 4) * 40;
      ctx.strokeStyle = 'rgba(220,230,255,0.9)';
      ctx.lineWidth = 3;
      const cx = 700, cy = 280;
      ctx.beginPath();
      ctx.moveTo(cx - 180 - wing, cy - 40); ctx.quadraticCurveTo(cx, cy - 140 + wing, cx + 180 + wing, cy - 40);
      ctx.stroke();
      for (let i = 0; i < 7; i++) {
        ctx.fillStyle = '#e8f0ff';
        ctx.beginPath(); ctx.arc(cx - 150 + i * 50 + Math.sin(t * 2 + i) * 8, cy - 60 + Math.sin(t * 3 + i) * 20, 4, 0, Math.PI * 2); ctx.fill();
      }
      const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, 60);
      glow.addColorStop(0, 'rgba(255,240,190,0.8)');
      glow.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 60, cy - 60, 120, 120);
    } else if (name === 'climb') {
      const p = localT / 10;
      Characters.drawLumi(ctx, 200 + p * 300, 500 - p * 250, t, { scale: 0.8 });
      Characters.drawKaito(ctx, 260 + p * 300, 540 - p * 250, t + 0.5, { scale: 0.8 });
      Characters.drawNix(ctx, 240 + p * 300, 480 - p * 250, t);
    }
  }

  function render(t) {
    const beats = activeBeats(t);
    for (const b of beats) {
      if (b.type === 'scene') currentScene = b.name;
      if (b.type === 'mood' && currentMood !== b.mood) {
        currentMood = b.mood;
        Sound.startMusic(b.mood);
      }
      if (b.type === 'sfx' && !b._played) {
        b._played = true;
        if (Sound.SFX[b.name]) Sound.SFX[b.name]();
      }
    }
    episode.beats.forEach((b) => { if (b.type === 'sfx' && t >= b.start + 2) b._played = false; });

    (sceneFns[currentScene] || sceneFns.city)(t);

    Characters.drawNix(ctx, 1100 + Math.sin(t * 1.2) * 30, 120 + Math.cos(t * 0.8) * 20, t, { scale: 0.8 });

    if (currentScene === 'city' && t > 20 && t < 80) {
      Characters.drawLumi(ctx, 400, 480, t, { scale: 1.1 });
      Characters.drawKaito(ctx, 560, 490, t, { scale: 1.1 });
      Characters.drawOrin(ctx, 820, 470, t, { scale: 1.1 });
    } else if (currentScene === 'academy' && t < 80) {
      Characters.drawOrin(ctx, 820, 480, t, { scale: 1.1 });
    } else if (currentScene === 'night') {
      Characters.drawLumi(ctx, 420, 500, t, { scale: 1 });
      Characters.drawKaito(ctx, 580, 510, t, { scale: 1 });
    } else if (currentScene === 'bridge') {
      Characters.drawLumi(ctx, 300, 560, t, { scale: 0.9 });
      Characters.drawKaito(ctx, 420, 575, t, { scale: 0.9 });
    }

    for (const b of beats) {
      if (b.type === 'anim') drawAnim(b.name, t, t - b.start);
      if (b.type === 'subtitle') Stage.subtitleBox(ctx, b.text, b.who);
    }

    // title cards
    if (t < 4) {
      ctx.fillStyle = 'rgba(6,9,26,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd98a';
      ctx.font = '900 54px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Starfall Academy', W / 2, H / 2 - 10);
      ctx.fillStyle = '#e8ecf8';
      ctx.font = '600 26px "Segoe UI", sans-serif';
      ctx.fillText(episode.title, W / 2, H / 2 + 40);
      ctx.textAlign = 'left';
    }
    if (t > episode.duration - 4) {
      ctx.fillStyle = 'rgba(6,9,26,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd98a';
      ctx.font = '900 40px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('To be continued…', W / 2, H / 2);
      ctx.textAlign = 'left';
    }
  }

  function loop(now) {
    if (!playing) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;
    if (time >= episode.duration) { pause(); time = episode.duration - 4.01; }
    render(time);
    updateClock();
    raf = requestAnimationFrame(loop);
  }

  function play() {
    if (playing) return;
    Sound.ensure();
    playing = true;
    last = performance.now();
    document.getElementById('play-btn').textContent = '⏸ Pause';
    raf = requestAnimationFrame(loop);
  }
  function pause() {
    playing = false;
    document.getElementById('play-btn').textContent = '▶ Play';
    if (raf) cancelAnimationFrame(raf);
  }
  function updateClock() {
    const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    document.getElementById('time').textContent = `${fmt(time)} / ${fmt(episode.duration)}`;
  }

  document.getElementById('play-btn').addEventListener('click', () => (playing ? pause() : play()));
  document.getElementById('restart-btn').addEventListener('click', () => { time = 0; currentMood = null; render(0); updateClock(); });
  document.getElementById('ep1-btn').addEventListener('click', () => loadEp(Episodes.ep1(), 'ep1-btn'));
  document.getElementById('ep2-btn').addEventListener('click', () => loadEp(Episodes.ep2(), 'ep2-btn'));

  function loadEp(ep, btnId) {
    pause();
    Sound.stopMusic();
    episode = ep;
    time = 0;
    currentMood = null;
    currentScene = 'city';
    document.querySelectorAll('.eps button').forEach((b) => b.classList.remove('active'));
    document.getElementById(btnId).classList.add('active');
    render(0);
    updateClock();
  }

  render(0);
  updateClock();
})();
</script>
</body>
</html>
