name: Centeryou — tests & build

on:
  pull_request:
    paths:
      - 'apps/centeryou/**'
      - '.github/workflows/centeryou-ci.yml'
      - '.github/workflows/scan-secrets.sh'
  push:
    branches:
      - 'vibe/novaloom-suite-fe60b6'
      - 'main'
    paths:
      - 'apps/centeryou/**'
      - '.github/workflows/centeryou-ci.yml'
      - '.github/workflows/scan-secrets.sh'
  workflow_dispatch:

jobs:
  centeryou:
    name: Tests Vitest + build Next.js (bloquants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/centeryou
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/centeryou/package-lock.json

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Tests automatisés Vitest + Testing Library
        run: npm test

      - name: Tests historiques du parseur (scripts/test-parser.mjs)
        run: npm run test:parser

      - name: Build de production Next.js
        run: npm run build

      # M-13 Verrou : scan de secrets BLOQUANT (grep de motifs de clés courantes
      # dans src/, public/, scripts/, tests/, configs et .github — zéro dépendance).
      - name: Scan de secrets (bloquant)
        run: bash .github/workflows/scan-secrets.sh

      # M-13 Verrou : npm audit INFORMATIF et non bloquant (les CVE connues de
      # next@14.2.35 / vitest sont suivies dans journal/sentinelle.md ; la montée
      # majeure est prévue après le lancement).
      - name: npm audit (informatif, non bloquant)
        run: npm audit --omit=dev || echo "::warning file=package.json::npm audit --omit=dev a remonté des vulnérabilités (informatif, non bloquant — suivi dans apps/centeryou/docs/journal/sentinelle.md)"
